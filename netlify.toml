[build]
  # Installs the functions' runtime dependency (@netlify/blobs) at the repo root, where the function
  # bundler can find it. Netlify builds run this; a CLI deploy does not, so run `npm install` in the
  # repo root before `netlify deploy`. (Functions v2 are bundled with nft: node_modules must resolve from here.)
  command = "npm ci --omit=dev"
  functions = "netlify/functions"
